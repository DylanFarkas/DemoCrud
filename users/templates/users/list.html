<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <div class="max-w-5xl mx-auto py-10">
        <header>
            <div class="flex justify-between items-center">
                <h1 class="text-3xl font-bold">Lista de usuarios</h1>
                <a href="{% url 'create_user' %}" class="bg-black text-white px-4 py-2 rounded-full">Crear usuario</a>
            </div>
        </header>

        <table class="w-full mt-8 text-left [&_th]:pb-3 [&_th]:font-medium [&_td]:py-3 [&_tr]:border-b [&_tr]:border-neutral-200">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>email</th>
                    <th>phone</th>
                    <th>Is Boss</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.first_name }}</td>
                    <td>{{ user.email }}</td>
                    <td>{{ user.phone }}</td>
                    <td>{{ user.is_boss }}</td>
                    <td>
                        <a href="{% url 'update_user' user.id %}" class="underline">Editar</a>
                        <form action="{% url 'delete_user' user.id %}" method="POST" class="inline ml-4">
                            {% csrf_token %}
                            <button type="submit" class="underline cursor-pointer">Eliminar</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>

</html>
